packages:
  - "apps/*"
  - "packages/*"
# Packages allowed to run install scripts (native binaries for the build and the Workers runtime).
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# Force the patched sharp everywhere, including Cloudflare's test tooling (GHSA-g89c-p67h-r497).
overrides:
  sharp: 0.35.4
# A package published less than a day ago is refused: hijacked releases are
# usually caught within hours. The exclude list below names the exact versions
# adopted inside that window on purpose.
minimumReleaseAge: 1440
# Exact versions adopted inside the 24-hour window, on purpose. Remove an entry once it is a day old.
minimumReleaseAgeExclude: []
