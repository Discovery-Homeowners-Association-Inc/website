name: Deploy admin

# Deploys the admin Worker (API plus admin screens) to Cloudflare on every
# push to main, after applying database migrations. The site build waits for
# this to finish (see site.yml) because it reads its content from the Worker
# this deploys. Needs the repository
# secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit, Workers KV
# Storage: Edit, Account Settings: Read) and the variable CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "apps/admin-ui/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dhoa/admin-ui run build
      - name: Apply database migrations
        working-directory: apps/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply dhoa --remote
      # A settings group added in code is a row the database does not have, and
      # the Worker refuses to build the public snapshot without it -- which
      # takes the site's build down with it. `insert or ignore`, so a value the
      # board has edited is never touched.
      - name: Create any settings the database does not have yet
        working-directory: apps/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/seed.ts
          pnpm exec wrangler d1 execute dhoa --remote --yes --file seed/settings.sql
      - name: Deploy the Worker
        working-directory: apps/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
