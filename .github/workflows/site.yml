name: Site

# Builds the public site from the admin app's published content and deploys it to
# Cloudflare as an assets-only Worker:
# - every morning (scheduled posts appear, expired ones disappear),
# - when the admin app asks (repository_dispatch from the Worker),
# - and on every push to main.
# With no SITE_CONTENT_URL variable set, it builds from the committed snapshot.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit,
# Account Settings: Read) and the variable CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 10 * * *" # 10:15 UTC, after the Worker's 10:00 expiry job
  repository_dispatch:
    types: [site-content-changed]
  workflow_dispatch:

permissions:
  contents: read
  # To see whether the admin deploy is still running; see the wait below.
  actions: read

concurrency:
  group: site-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # This build reads its content from the deployed admin Worker, and both
      # workflows start on the same push. Racing it meant fetching the content
      # from the version being replaced: a deploy that had already written the
      # park markers to the database produced a parks page with no markers.
      #
      # Said here rather than with a `workflow_run` trigger, which would order
      # the two but is a privileged trigger that zizmor gates on sight -- and
      # rightly, since it is worth more than the few lines it would save.
      - name: Wait for the admin deploy, which this reads its content from
        if: vars.SITE_CONTENT_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On a push, only a deploy of this same commit matters; on a schedule
          # or a dispatch, any deploy in flight does. A run can take a few
          # seconds to be listed after the push, so a push waits before it looks.
          if [ "${{ github.event_name }}" = "push" ]; then sleep 20; fi
          for _ in $(seq 1 60); do
            if [ "${{ github.event_name }}" = "push" ]; then
              busy=$(gh run list --workflow=deploy-admin.yml --limit 20 \
                --json status,headSha \
                --jq '[.[] | select(.status != "completed" and .headSha == "${{ github.sha }}")] | length')
            else
              busy=$(gh run list --workflow=deploy-admin.yml --limit 20 \
                --json status \
                --jq '[.[] | select(.status != "completed")] | length')
            fi
            if [ "$busy" = "0" ]; then echo "admin deploy is idle"; exit 0; fi
            echo "admin deploy is busy; waiting"
            sleep 10
          done
          echo "admin deploy still running after ten minutes" >&2
          exit 1
      - run: pnpm install --frozen-lockfile
      - name: Fetch the latest published content
        if: vars.SITE_CONTENT_URL != ''
        env:
          SITE_CONTENT_URL: ${{ vars.SITE_CONTENT_URL }}
        run: node scripts/snapshot.ts "$SITE_CONTENT_URL"
      - name: Build the site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: pnpm --filter @dhoa/site run build
      - name: Deploy the site Worker
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
